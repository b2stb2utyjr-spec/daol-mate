<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daol Mate 4기 예약 시스템</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  body { font-family: 'Pretendard', sans-serif; }
  .calendar-day-content {
    max-height: 3rem;
    overflow-y: auto;
    width: 100%;
    text-align: center;
    margin-top: 0.25rem;
  }
  .badge {
    background-color: rgba(255 255 255 / 0.85);
    padding: 1px 5px;
    border-radius: 8px;
    font-size: 8px;
    color: #4f46e5;
    font-weight: 600;
    margin: 1px auto;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
<header class="bg-indigo-900 text-white shadow-md">
  <div class="max-w-4xl mx-auto px-4 py-5 flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold flex items-center gap-2">
        <span>🤝</span> Daol Mate 4기 예약 시스템
      </h1>
      <p class="text-indigo-200 text-sm mt-1">운영 기간: 2026년 11월 9일 ~ 2027년 1월 31일</p>
    </div>
    <button style="display:none;" class="bg-indigo-800 hover:bg-indigo-700 text-xs px-3 py-2 rounded-lg border border-indigo-700 transition flex items-center gap-1 shadow-sm" onclick="openApiModal()">
      ⚙️ API 설정
    </button>
  </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full">
  <section id="tab-calendar" class="space-y-6">
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h2 class="text-lg font-bold text-slate-900">운영 안내</h2>
        <p class="text-sm text-slate-600 mt-1">
          • 만남 횟수: 최소 달에 1번<br />
          • 만남 방식: 점심 or 티타임 or 저녁 미팅
        </p>
      </div>
      <button onclick="scrollToBooking()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl font-medium text-sm transition shadow-sm">
        바로 예약하기 ✍️
      </button>
    </div>
    <div class="space-y-8">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <h3 class="text-md font-bold text-slate-800 mb-4 flex items-center justify-between">
          <span>2026년 11월</span>
          <span class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-full font-medium">11/9 (월) 시작</span>
        </h3>
        <div class="grid grid-cols-7 gap-2 text-center text-xs font-semibold text-slate-400 mb-2">
          <span class="text-red-500">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
        </div>
        <div class="grid grid-cols-7 gap-2 text-xs" id="cal-2026-11"></div>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <h3 class="text-md font-bold text-slate-800 mb-4">2026년 12월</h3>
        <div class="grid grid-cols-7 gap-2 text-center text-xs font-semibold text-slate-400 mb-2">
          <span class="text-red-500">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
        </div>
        <div class="grid grid-cols-7 gap-2 text-xs" id="cal-2026-12"></div>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
        <h3 class="text-md font-bold text-slate-800 mb-4">2027년 1월</h3>
        <div class="grid grid-cols-7 gap-2 text-center text-xs font-semibold text-slate-400 mb-2">
          <span class="text-red-500">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
        </div>
        <div class="grid grid-cols-7 gap-2 text-xs" id="cal-2027-1"></div>
      </div>
    </div>
    <div id="booking-form-card" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
      <h3 class="text-lg font-bold text-slate-900 mb-4" id="form-title">새 일정 예약하기</h3>
      <form id="bookingForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <input type="hidden" id="editId" />
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">신청자 (본인)</label>
          <select id="name" required class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="">선택하세요</option>
            <option value="박병찬 사원">박병찬 사원</option>
            <option value="윤석민 대리">윤석민 대리</option>
            <option value="한승균 부장">한승균 부장</option>
            <option value="최서윤 사원">최서윤 사원</option>
            <option value="박정민 사원">박정민 사원</option>
            <option value="신태림 부장">신태림 부장</option>
            <option value="옥희진 과장">옥희진 과장</option>
            <option value="김민석 부장">김민석 부장</option>
            <option value="최선수 과장">최선수 과장</option>
            <option value="박지현 부장">박지현 부장</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">날짜 선택</label>
          <input type="date" id="date" required min="2026-11-04" max="2027-01-31" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">만남 방식</label>
          <select id="time" required class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="점심 미팅">점심 미팅</option>
            <option value="티타임">티타임</option>
            <option value="저녁 미팅">저녁 미팅</option>
          </select>
        </div>
        <div class="flex items-center space-x-2">
          <input type="checkbox" id="withPlanner" class="w-4 h-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" />
          <label for="withPlanner" class="text-sm text-slate-700 select-none">
            첫 미팅(식사) 시 경영기획팀 담당자가 함께 참석 (선택사항)
          </label>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden bg-slate-100 text-slate-600 px-4 py-2 rounded-xl text-sm font-medium hover:bg-slate-200 transition">
            취소
          </button>
          <button type="submit" id="submitBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-xl text-sm font-medium transition shadow-sm">
            예약 등록하기
          </button>
        </div>
      </form>
    </div>
    <!-- 예약 리스트 표시 영역 -->
    <div id="reservation-list" class="mt-8 space-y-3 max-h-96 overflow-y-auto"></div>
  </section>
</main>

<script>
let apiUrl = 'https://script.google.com/macros/s/AKfycbxUqUsp2acso6GQrXoYFt1pOTZUe3AG-YNP-9LIupQDxOi7k-n2678H7b4ag8xrTE92/exec';
let reservations = [];

document.addEventListener('DOMContentLoaded', () => {
  renderCalendars();
  fetchReservations();
  setInterval(fetchReservations, 5000);
});

async function fetchReservations() {
  try {
    const res = await fetch(apiUrl);
    const data = await res.json();
    reservations = data || [];
    renderCalendars();
    renderReservationsList();
  } catch (e) {
    console.error(e);
  }
}

async function sendToServer(payload) {
  try {
    await fetch(apiUrl, {
      method: 'POST',
      body: JSON.stringify(payload),
    });
    return true;
  } catch (e) {
    alert('서버 통신 오류가 발생했습니다.');
    return false;
  }
}

async function handleFormSubmit(event) {
  event.preventDefault();
  const editId = document.getElementById('editId').value;
  const payload = {
    id: editId ? editId : 'res_' + Date.now(),
    name: document.getElementById('name').value,
    date: document.getElementById('date').value,
    time: document.getElementById('time').value,
    withPlanner: document.getElementById('withPlanner').checked,
    action: editId ? 'update' : 'add'
  };
  const success = await sendToServer(payload);
  if (success) {
    alert(editId ? '일정이 수정되었습니다!' : '예약이 등록되었습니다!');
    resetForm();
    fetchReservations();
  }
}

function resetForm() {
  const form = document.getElementById('bookingForm');
  form.reset();
  document.getElementById('editId').value = '';
  document.getElementById('form-title').innerText = '새 일정 예약하기';
  document.getElementById('submitBtn').innerText = '예약 등록하기';
  document.getElementById('cancelEditBtn').classList.add('hidden');
}

function scrollToBooking() {
  window.scrollTo({ top: document.getElementById('booking-form-card').offsetTop - 50, behavior: 'smooth' });
}

function renderCalendars() {
  buildCalendar('cal-2026-11', 2026, 10);
  buildCalendar('cal-2026-12', 2026, 11);
  buildCalendar('cal-2027-1', 2027, 0);
}

function buildCalendar(elementId, year, month) {
  const container = document.getElementById(elementId);
  if (!container) return;
  container.innerHTML = '';
  const firstDay = new Date(year, month, 1).getDay();
  const lastDate = new Date(year, month + 1, 0).getDate();
  for(let i=0; i<firstDay; i++) {
    container.innerHTML += `<div></div>`;
  }
  for(let d=1; d<=lastDate; d++) {
    const mm = String(month + 1).padStart(2, '0');
    const dd = String(d).padStart(2, '0');
    const dateStr = `${year}-${mm}-${dd}`;
    const dayBookings = reservations.filter(r => r.date === dateStr);
    let bgClass = 'hover:bg-slate-100 text-slate-700';
    if(year === 2026 && month === 10 && d === 9) {
      bgClass = 'bg-indigo-50 text-indigo-700 font-bold border border-indigo-200';
    }
    if(dayBookings.length) {
      bgClass = 'bg-indigo-600 text-white font-bold shadow-sm';
    }
    container.innerHTML += `
      <div onclick="selectDate('${dateStr}')" class="aspect-square rounded-xl flex flex-col items-center justify-center text-xs cursor-pointer transition ${bgClass}" title="${dayBookings.map(b=>b.name).join(', ')}">
        <span>${d}</span>
        <div class="calendar-day-content">
          ${dayBookings.map(b => `<div class="badge" title="${b.name}">${b.name} (${b.time})</div>`).join('')}
        </div>
      </div>
    `;
  }
}

function selectDate(dateStr) {
  document.getElementById('date').value = dateStr;
  showDayReservations(dateStr);
  scrollToBooking();
}

function renderReservationsList() {
  const listEl = document.getElementById('reservation-list');
  if(reservations.length === 0) {
    listEl.innerHTML = '<div class="bg-white p-8 rounded-2xl text-center text-slate-400 text-sm border border-slate-100">등록된 예약 내역이 없습니다.</div>';
    return;
  }
  const sorted = [...reservations].sort((a,b) => new Date(a.date) - new Date(b.date));
  listEl.innerHTML = sorted.map(item => `
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div class="space-y-1">
        <div class="flex items-center gap-2">
          <span class="font-bold text-slate-900">${item.name}</span>
          <span class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-0.5 rounded-full font-medium">${item.time}</span>
          ${item.withPlanner ? '<span class="ml-2 text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-medium select-none">🤝 경영기획팀 동행</span>' : ''}
        </div>
        <div class="text-xs text-slate-500 flex items-center gap-3">
          <span>📅 ${item.date}</span>
        </div>
      </div>
      <div class="flex items-center gap-2 w-full md:w-auto justify-end">
        <button onclick="editReservation('${item.id}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 py-1.5 rounded-lg font-medium transition">수정</button>
        <button onclick="deleteReservation('${item.id}')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs px-3 py-1.5 rounded-lg font-medium transition">삭제</button>
      </div>
    </div>
  `).join('');
}

function showDayReservations(dateStr) {
  const dayReservations = reservations.filter(r => r.date === dateStr);
  const listEl = document.getElementById('reservation-list');
  if(dayReservations.length === 0) {
    listEl.innerHTML = `<div class="bg-white p-6 rounded-xl text-center text-slate-500 text-sm border border-slate-200">해당 날짜에 예약이 없습니다.</div>`;
  } else {
    listEl.innerHTML = dayReservations.map(item => `
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
          <span class="font-bold">${item.name}</span> <span class="text-xs text-slate-500">(${item.time})</span>
          ${item.withPlanner ? '<span class="ml-2 text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-medium select-none">🤝 경영기획팀 동행</span>' : ''}
        </div>
        <div class="flex gap-2">
          <button onclick="editReservation('${item.id}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 py-1 rounded-lg font-medium transition">수정</button>
          <button onclick="deleteReservation('${item.id}')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs px-3 py-1 rounded-lg font-medium transition">삭제</button>
        </div>
      </div>
    `).join('');
  }
}

function editReservation(id) {
  const item = reservations.find(r => r.id == id);
  if(!item) return;
  document.getElementById('editId').value = item.id;
  document.getElementById('name').value = item.name;
  document.getElementById('date').value = item.date;
  document.getElementById('time').value = item.time;
  document.getElementById('withPlanner').checked = !!item.withPlanner;
  document.getElementById('form-title').innerText = '일정 수정하기';
  document.getElementById('submitBtn').innerText = '수정 완료';
  document.getElementById('cancelEditBtn').classList.remove('hidden');
  scrollToBooking();
}

function deleteReservation(id) {
  if(confirm('정말 이 예약을 삭제하시겠습니까?')) {
    sendToServer({id: id, action: 'delete'}).then(success => {
      if(success) fetchReservations();
    });
  }
}
</script>
</body>
</html>
